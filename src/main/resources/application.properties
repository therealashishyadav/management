spring.application.name=MANAGEMENT-SERVICE
server.port=${PORT:8086}

# Disable database auto-configuration (we don't need a database)
spring.autoconfigure.exclude=org.springframework.boot.autoconfigure.jdbc.DataSourceAutoConfiguration,org.springframework.boot.autoconfigure.orm.jpa.HibernateJpaAutoConfiguration

# Feign clients URL configuration
# For Render deployment, use environment variables pointing to actual service URLs
# For local development, defaults use localhost
services.account-service.url=${ACCOUNT_SERVICE_URL:https://nookaccount.onrender.com}
services.add-pg-service.url=${ADD_PG_SERVICE_URL:https://nookaddpg.onrender.com}
services.inquiry-service.url=${INQUIRY_SERVICE_URL:https://nooklyinquiry.onrender.com}
services.tenant-service.url=${TENANT_SERVICE_URL:https://nooktenantservice.onrender.com}

# Shared environment variables from other services
spring.datasource.url=${SPRING_DATASOURCE_URL:}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:}

spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}

cloudinary.cloud-name=${CLOUDINARY_CLOUD_NAME:}
cloudinary.api-key=${CLOUDINARY_API_KEY:}
cloudinary.api-secret=${CLOUDINARY_API_SECRET:}

app.jwt-secret=${JWT_SECRET:}

management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never